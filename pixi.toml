[workspace]
authors = ["Brian Rogoff <brogoff@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "molina"
platforms = ["linux-64"]
version = "0.1.0"
# molina is also a pixi-build package (below); consumers need pixi 0.84+
preview = ["pixi-build"]

[tasks]
test = "bash tests/run_all.sh"
test-release = { cmd = "bash tests/run_all.sh", env = { MOJO_FLAGS = "-D ASSERT=none" } }
# build/molina.mojoc: what a consumer's pixi builds from this package
package = "mkdir -p build && mojo precompile molina -o build/molina.mojoc"
format = "mojo format molina tests"
# `pixi run doc-check [--list PATTERN]`: doc string warnings (must be none)
doc-check = "python docs/check_docstrings.py"
# API reference as Markdown in docs/api/, from `mojo doc`
docs = "python docs/gen_api.py"

[dependencies]
mojo = ">=1.3.0.dev0,<2"
python = ">=3.12,<3.14"

# The package consumers depend on, e.g.
#   molina = { git = "https://github.com/bpr/molina", tag = "v0.1.0" }
# pixi-build-mojo compiles it from source with the consumer's Mojo; the
# consumer names that version in `[workspace.build-variants]` (see README).
[package]
name = "molina"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "*" }

[package.build.config.pkg]
name = "molina"

[package.host-dependencies]
mojo-compiler = "*"

[package.build-dependencies]
mojo-compiler = "*"
